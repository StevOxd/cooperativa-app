# ==============================================================================
# Configuración de Nginx para Cooperativa Frontend (SPA React + Vite)
# Proxy Inverso para Backend REST API y WebSockets (Socket.IO)
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Resolver DNS interno de Docker: evita que Nginx cachee de forma permanente
    # la IP del backend obtenida al arrancar (las IPs cambian al recrear contenedores)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Compresión Gzip para alto rendimiento en red
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Cabeceras de seguridad HTTP para protección contra ataques comunes
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Directorio raíz donde residen los archivos estáticos de la SPA
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Cache agresivo e inmutable para assets estáticos con hash de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 2. Carga de documentos de afiliación: un documento pesa hasta 5 MB (unos 6.7 MB en Base64 dentro del JSON).
    #    Solo estas rutas aceptan 8 MB; el resto de la API sigue con el límite por defecto de 1 MB. Son las mismas
    #    de backend/src/config/limitesCuerpo.js (portal, expediente, ventanilla por DPI o por solicitud, en línea y
    #    personal).
    location ~ ^/api/(asociado/documentos|admin/asociados/([0-9]+/documentos|documentos-afiliacion)|operador/afiliaciones/[0-9]+/documentos|afiliacion/(personal/)?documentos)$ {
        client_max_body_size 8m;
        set $backend_docs http://backend:5000;
        proxy_pass $backend_docs$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2.1 PDF firmado de una solicitud de crédito (asociado, operador al elevar y ejecutivo al resolver): hasta 10 MB,
    #     unos 13.4 MB en Base64 dentro del JSON. Solo estas rutas aceptan 14 MB (issue #78).
    location ~ ^/api/(asociado/creditos/[0-9]+/subir-expediente-firmado|operador/creditos/[0-9]+/elevar|ejecutivo/creditos/[0-9]+/resolver)$ {
        client_max_body_size 14m;
        set $backend_pdf http://backend:5000;
        proxy_pass $backend_pdf$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Proxy Inverso para la API REST hacia el contenedor backend Express
    location /api/ {
        # El uso de una variable obliga a Nginx a resolver el hostname en tiempo de
        # ejecucion mediante el resolver declarado, no una unica vez al iniciar
        set $backend_api http://backend:5000;
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. Proxy Inverso para WebSockets de Socket.IO hacia el backend Express
    location /socket.io/ {
        set $backend_ws http://backend:5000;
        proxy_pass $backend_ws$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. Enrutamiento para SPA (React Router)
    # Cualquier ruta no encontrada en el sistema de archivos se redirige a index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 6. Páginas de error personalizadas
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
