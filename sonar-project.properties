sonar.projectKey=StevOxd_cooperativa-app
sonar.organization=stevoxd
sonar.projectName=cooperativa-app

sonar.sources=.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,backend/uploads/**,backend/test*.js,backend/tests/**,backend/scripts/test*.js,frontend/src/test/**,.agent/**,.claude/**,docs/**

sonar.tests=backend,frontend/src/test
sonar.test.inclusions=backend/test*.js,backend/tests/**,backend/scripts/test*.js,frontend/src/test/**

sonar.javascript.lcov.reportPaths=backend/coverage/regresion/lcov.info,backend/coverage/jest/lcov.info,frontend/coverage/lcov.info
# El banco es un simulador que corre en su contenedor durante las pruebas: su cobertura no se instrumenta.
sonar.coverage.exclusions=banco-backend/**,frontend/src/main.jsx,frontend/src/dev/**,**/eslint.config.js,**/jest.config.js,**/vite.config.js,**/tailwind.config.js,**/postcss.config.js,scripts/**,backend/scripts/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
