# ==============================================================================
# Docker Compose - Orquestación Integral del Ecosistema Cooperativa
# Servicios: Base de Datos PostgreSQL 16, Backend Node.js y Frontend React/Nginx
# Red: cooperativa-net | Volumen: cooperativa_db_data
#
# Compose lee automáticamente el archivo .env de esta carpeta (cópielo de .env.example).
# Las claves no tienen valor por defecto: si falta alguna, Compose se detiene y lo indica.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Base de Datos Relacional PostgreSQL 16
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: cooperativa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cooperativa_db}
      POSTGRES_USER: ${DB_USER:-cooperativa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env (vea .env.example)}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - cooperativa_db_data:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # Solo en esta máquina (127.0.0.1): las pruebas locales se conectan a la base por este puerto.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cooperativa_user} -d ${DB_NAME:-cooperativa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cooperativa-net

  # ----------------------------------------------------------------------------
  # 2. Servidor Backend Core Bancario (Simulador API Entidad Bancaria)
  # ----------------------------------------------------------------------------
  banco-backend:
    container_name: banco-backend
    build:
      context: ./banco-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5002
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-cooperativa_user}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env (vea .env.example)}
      DB_NAME: banco_db
      BANCO_INTERNAL_API_KEY: ${BANCO_INTERNAL_API_KEY:?Falta BANCO_INTERNAL_API_KEY en .env (vea .env.example)}
    # El backend llega al banco por la red interna (http://banco-backend:5002). Se publica solo
    # en 127.0.0.1 para las pruebas locales; nunca hacia la red.
    ports:
      - "127.0.0.1:5002:5002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5002/api/banco/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cooperativa-net

  # ----------------------------------------------------------------------------
  # 3. Servidor Backend API Express & WebSockets (Cooperativa)
  # ----------------------------------------------------------------------------
  backend:
    container_name: cooperativa-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      banco-backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-cooperativa_user}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env (vea .env.example)}
      DB_NAME: ${DB_NAME:-cooperativa_db}
      BANCO_API_URL: http://banco-backend:5002
      BANCO_INTERNAL_API_KEY: ${BANCO_INTERNAL_API_KEY:?Falta BANCO_INTERNAL_API_KEY en .env (vea .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env (vea .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_SERVICE: ${MAIL_SERVICE:-google}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cooperativa-net

  # ----------------------------------------------------------------------------
  # 3. Aplicación Frontend React Vite servida por Nginx Alpine
  # ----------------------------------------------------------------------------
  frontend:
    container_name: cooperativa-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: /
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cooperativa-net

# ------------------------------------------------------------------------------
# Redes Internas de Comunicación Docker
# ------------------------------------------------------------------------------
networks:
  cooperativa-net:
    name: cooperativa-net
    driver: bridge

# ------------------------------------------------------------------------------
# Volúmenes Persistentes de Datos
# ------------------------------------------------------------------------------
volumes:
  cooperativa_db_data:
    name: cooperativa_db_data
